apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-chart.fullname" . }}-frontend-config
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # Runtime config consumed by the SPA. Path-based routing keeps the backend on
  # the same host under /api.
  config.js: |
    window.APP_CONFIG = { apiBaseUrl: "/api" };
