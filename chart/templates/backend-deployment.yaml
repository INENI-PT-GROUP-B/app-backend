apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-chart.fullname" . }}-backend
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "app-chart.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-chart.backendSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ required "image.backend.tag is required" .Values.image.backend.tag }}"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "db.secretName is required" .Values.db.secretName }}
                  key: {{ .Values.db.urlKey }}
          # Migrations run on startup before the server listens; the startupProbe
          # holds liveness/readiness off until /healthz is up, so a slow
          # migration cannot trigger a liveness restart loop.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
