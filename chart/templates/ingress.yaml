apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app-chart.fullname" . }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
  {{- if .Values.ingress.basicAuthMiddlewareRef }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.ingress.basicAuthMiddlewareRef }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "app-chart.fullname" . }}-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app-chart.fullname" . }}-frontend
                port:
                  number: 80
