# Local development only. Production uses CloudNativePG in Kubernetes;
# this file is NOT part of any deployment pipeline.
services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
